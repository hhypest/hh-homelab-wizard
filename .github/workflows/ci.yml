name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore HhHomelab.Wizard.slnx --locked-mode
      - name: Build
        run: dotnet build HhHomelab.Wizard.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test HhHomelab.Wizard.slnx --no-build --configuration Release
      - name: Validate research inventory
        run: dotnet run --project tools/HhHomelab.Wizard.ProfileCheck --no-build --configuration Release -- profiles/hh-homelab/1.3.0/research-profile.json

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked desktop dependencies
        run: dotnet restore HhHomelab.Wizard.slnx --locked-mode
      - name: Publish demo and native probe with runtime
        run: |
          dotnet publish src/HhHomelab.Wizard.Desktop -c Release -r ${{ matrix.rid }} --self-contained true --no-restore -o artifacts/desktop
          dotnet publish tools/HhHomelab.Wizard.DesktopProbe -c Release -r ${{ matrix.rid }} --self-contained true --no-restore -o artifacts/probe
      - name: Install X11 dependencies for native smoke check
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1 libgl1 fonts-dejavu-core
      - name: Check native Win32 window
        if: runner.os == 'Windows'
        run: ./artifacts/probe/HhHomelab.Wizard.DesktopProbe.exe
      - name: Check native X11 window under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a ./artifacts/probe/HhHomelab.Wizard.DesktopProbe
      - name: Include project licenses and usage notes
        shell: pwsh
        run: |
          Copy-Item LICENSE artifacts/desktop/LICENSE
          Copy-Item -Recurse LICENSES artifacts/desktop/LICENSES
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/desktop/THIRD_PARTY_NOTICES.md
          Copy-Item docs/m1/PACKAGE_README.md artifacts/desktop/DEMO.md
      - name: Upload trial application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hh-homelab-wizard-m1-demo-${{ matrix.rid }}
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 14
      - name: Upload native rendering evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m1-native-screens-${{ matrix.rid }}
          path: artifacts/native-desktop/
          if-no-files-found: error
          retention-days: 14

  qb-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked probe dependencies
        run: dotnet restore tools/HhHomelab.Wizard.QbDockerProbe --locked-mode
      - name: Build probe
        run: dotnet build tools/HhHomelab.Wizard.QbDockerProbe --no-restore --configuration Release
      - name: Pull pinned research image
        run: docker pull lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls479
      - name: Verify bootstrap twice on fresh containers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            dotnet run --project tools/HhHomelab.Wizard.QbDockerProbe --no-build --configuration Release -- profiles/hh-homelab/1.3.0/research-profile.json
          done

  arr-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked probe dependencies
        run: dotnet restore tools/HhHomelab.Wizard.ArrDockerProbe --locked-mode
      - name: Build probe
        run: dotnet build tools/HhHomelab.Wizard.ArrDockerProbe --no-restore --configuration Release
      - name: Pull pinned research images
        shell: bash
        run: |
          set -euo pipefail
          docker pull lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls479
          docker pull lscr.io/linuxserver/radarr:6.4.4.10685-ls319
          docker pull lscr.io/linuxserver/sonarr:4.0.20.3014-ls326
          docker pull lscr.io/linuxserver/prowlarr:2.6.5.5623-ls163
      - name: Verify Arr bootstrap twice on fresh configurations
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            dotnet run --project tools/HhHomelab.Wizard.ArrDockerProbe --no-build --configuration Release -- profiles/hh-homelab/1.3.0/research-profile.json
          done

  ha-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked probe dependencies
        run: dotnet restore tools/HhHomelab.Wizard.HaDockerProbe --locked-mode
      - name: Build probe
        run: dotnet build tools/HhHomelab.Wizard.HaDockerProbe --no-restore --configuration Release
      - name: Pull pinned HA and Jellyfin images
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/home-assistant/home-assistant:2026.10.0
          docker pull lscr.io/linuxserver/jellyfin:12.2ubu2604-ls53
      - name: Verify HA onboarding and configuration twice on fresh containers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            dotnet run --project tools/HhHomelab.Wizard.HaDockerProbe --no-build --configuration Release -- profiles/hh-homelab/1.3.0/research-profile.json
          done

  ha-profile-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hhypest/hh-homelab
          ref: b05047b081f3543520582315002e359ef1d93e59
          path: upstream-fixture
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked profile probe dependencies
        run: dotnet restore tools/HhHomelab.Wizard.HaProfileProbe --locked-mode
      - name: Build profile probe
        run: dotnet build tools/HhHomelab.Wizard.HaProfileProbe --no-restore --configuration Release
      - name: Pull pinned HA image
        run: docker pull ghcr.io/home-assistant/home-assistant:2026.10.0
      - name: Verify local YAML, component imports and TV templates twice
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            dotnet run --project tools/HhHomelab.Wizard.HaProfileProbe --no-build --configuration Release -- upstream-fixture
          done

  ha-local-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hhypest/hh-homelab
          ref: b05047b081f3543520582315002e359ef1d93e59
          path: upstream-fixture
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked runtime probe dependencies
        run: dotnet restore tools/HhHomelab.Wizard.HaRuntimeProbe --locked-mode
      - name: Build runtime probe
        run: dotnet build tools/HhHomelab.Wizard.HaRuntimeProbe --no-restore --configuration Release
      - name: Pull pinned HA and Socket Proxy images
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/home-assistant/home-assistant:2026.10.0
          docker pull ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
      - name: Verify full HA server and accelerated action fixtures twice
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            dotnet run --project tools/HhHomelab.Wizard.HaRuntimeProbe --no-build --configuration Release -- upstream-fixture
          done

  media-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked probe dependencies
        run: dotnet restore tools/HhHomelab.Wizard.MediaDockerProbe --locked-mode
      - name: Build probe
        run: dotnet build tools/HhHomelab.Wizard.MediaDockerProbe --no-restore --configuration Release
      - name: Pull pinned research images
        shell: bash
        run: |
          set -euo pipefail
          docker pull lscr.io/linuxserver/radarr:6.4.4.10685-ls319
          docker pull lscr.io/linuxserver/sonarr:4.0.20.3014-ls326
          docker pull lscr.io/linuxserver/jellyfin:12.2ubu2604-ls53
          docker pull ghcr.io/seerr-team/seerr:v3.5.0
      - name: Verify Jellyfin and Seerr twice on fresh configurations
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            dotnet run --project tools/HhHomelab.Wizard.MediaDockerProbe --no-build --configuration Release -- profiles/hh-homelab/1.3.0/research-profile.json
          done
