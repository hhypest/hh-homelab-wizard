name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify registry pull retry policy
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/test-pull-image.sh
      - name: Verify profile selection rejects drift before image acquisition
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/test-pull-profile-images.sh
      - name: Restore locked dependencies
        run: dotnet restore HhHomelab.Wizard.slnx --locked-mode
      - name: Build
        run: dotnet build HhHomelab.Wizard.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test HhHomelab.Wizard.slnx --no-build --configuration Release
      - name: Verify journal across killed processes and competing instances
        run: dotnet run --project tools/HhHomelab.Wizard.JournalProbe --no-build --configuration Release
      - name: Validate research inventory
        run: dotnet run --project tools/HhHomelab.Wizard.ProfileCheck --no-build --configuration Release -- profiles/hh-homelab/1.3.0/research-profile.json

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked desktop dependencies
        run: dotnet restore HhHomelab.Wizard.slnx --locked-mode
      - name: Publish demo and native probe with runtime
        run: |
          dotnet publish src/HhHomelab.Wizard.Desktop -c Release -r ${{ matrix.rid }} --self-contained true --no-restore -o artifacts/desktop
          dotnet publish tools/HhHomelab.Wizard.DesktopProbe -c Release -r ${{ matrix.rid }} --self-contained true --no-restore -o artifacts/probe
      - name: Install X11 and Wayland dependencies for native smoke checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb weston libx11-6 libice6 libsm6 libfontconfig1 libgl1 libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri libwayland-client0 libwayland-egl1 libxkbcommon0 fonts-dejavu-core
      - name: Check native Win32 window
        if: runner.os == 'Windows'
        run: ./artifacts/probe/HhHomelab.Wizard.DesktopProbe.exe --expect-backend Win32
      - name: Check native X11 window under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET ./artifacts/probe/HhHomelab.Wizard.DesktopProbe --expect-backend X11
      - name: Check unavailable Wayland falls back to X11
        if: runner.os == 'Linux'
        run: xvfb-run -a env -u WAYLAND_SOCKET WAYLAND_DISPLAY=wizard-missing ./artifacts/probe/HhHomelab.Wizard.DesktopProbe --expect-backend X11
      - name: Check native Wayland window without XWayland
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --use-gl --socket=wizard-wayland --idle-time=0 --width=1280 --height=1024 --log="$RUNNER_TEMP/wizard-weston.log" &
          compositor_pid=$!
          trap 'kill "$compositor_pid" 2>/dev/null || true; wait "$compositor_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if [ -S "$XDG_RUNTIME_DIR/wizard-wayland" ]; then break; fi
            if ! kill -0 "$compositor_pid" 2>/dev/null; then cat "$RUNNER_TEMP/wizard-weston.log"; exit 1; fi
            sleep 0.1
          done
          if [ ! -S "$XDG_RUNTIME_DIR/wizard-wayland" ]; then cat "$RUNNER_TEMP/wizard-weston.log"; exit 1; fi
          env -u DISPLAY -u WAYLAND_SOCKET WAYLAND_DISPLAY=wizard-wayland LIBGL_ALWAYS_SOFTWARE=1 ./artifacts/probe/HhHomelab.Wizard.DesktopProbe --expect-backend Wayland
      - name: Include project licenses and usage notes
        shell: pwsh
        run: |
          Copy-Item LICENSE artifacts/desktop/LICENSE
          Copy-Item -Recurse LICENSES artifacts/desktop/LICENSES
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/desktop/THIRD_PARTY_NOTICES.md
          Copy-Item docs/m1/PACKAGE_README.md artifacts/desktop/DEMO.md
      - name: Upload trial application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hh-homelab-wizard-m1-demo-${{ matrix.rid }}
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 14
      - name: Upload native rendering evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m1-native-screens-${{ matrix.rid }}
          path: artifacts/native-desktop/
          if-no-files-found: error
          retention-days: 14

  qb-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked probe dependencies
        run: dotnet restore tools/HhHomelab.Wizard.QbDockerProbe --locked-mode
      - name: Build probe
        run: dotnet build tools/HhHomelab.Wizard.QbDockerProbe --no-restore --configuration Release
      - name: Pull pinned research image
        run: bash .github/scripts/pull-profile-images.sh qbittorrent
      - name: Verify bootstrap twice on fresh containers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            dotnet run --project tools/HhHomelab.Wizard.QbDockerProbe --no-build --configuration Release -- profiles/hh-homelab/1.3.0/research-profile.json
          done

  arr-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked probe dependencies
        run: dotnet restore tools/HhHomelab.Wizard.ArrDockerProbe --locked-mode
      - name: Build probe
        run: dotnet build tools/HhHomelab.Wizard.ArrDockerProbe --no-restore --configuration Release
      - name: Pull pinned research images
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/pull-profile-images.sh qbittorrent radarr sonarr prowlarr
      - name: Verify Arr bootstrap twice on fresh configurations
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            dotnet run --project tools/HhHomelab.Wizard.ArrDockerProbe --no-build --configuration Release -- profiles/hh-homelab/1.3.0/research-profile.json
          done

  ha-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked probe dependencies
        run: dotnet restore tools/HhHomelab.Wizard.HaDockerProbe --locked-mode
      - name: Build probe
        run: dotnet build tools/HhHomelab.Wizard.HaDockerProbe --no-restore --configuration Release
      - name: Pull pinned HA and Jellyfin images
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/pull-profile-images.sh homeassistant jellyfin
      - name: Verify HA onboarding and configuration twice on fresh containers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            dotnet run --project tools/HhHomelab.Wizard.HaDockerProbe --no-build --configuration Release -- profiles/hh-homelab/1.3.0/research-profile.json
          done

  ha-profile-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hhypest/hh-homelab
          ref: b05047b081f3543520582315002e359ef1d93e59
          path: upstream-fixture
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked profile probe dependencies
        run: dotnet restore tools/HhHomelab.Wizard.HaProfileProbe --locked-mode
      - name: Build profile probe
        run: dotnet build tools/HhHomelab.Wizard.HaProfileProbe --no-restore --configuration Release
      - name: Pull pinned HA image
        run: bash .github/scripts/pull-profile-images.sh homeassistant
      - name: Verify local YAML, component imports and TV templates twice
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            dotnet run --project tools/HhHomelab.Wizard.HaProfileProbe --no-build --configuration Release -- upstream-fixture
          done

  ha-local-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hhypest/hh-homelab
          ref: b05047b081f3543520582315002e359ef1d93e59
          path: upstream-fixture
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
