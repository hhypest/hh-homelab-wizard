      - name: Build probe
        run: dotnet build tools/HhHomelab.Wizard.MediaDockerProbe --no-restore --configuration Release
      - name: Pull pinned research images
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/pull-profile-images.sh radarr sonarr jellyfin seerr
      - name: Verify Jellyfin and Seerr twice on fresh configurations
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            dotnet run --project tools/HhHomelab.Wizard.MediaDockerProbe --no-build --configuration Release -- profiles/hh-homelab/1.3.0/research-profile.json
          done
